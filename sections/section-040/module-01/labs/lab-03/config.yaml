# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
apiVersion: astrona.io/v1
metadata:
  name: ats-017-lab-040-01-03
  docs:
    question: question.md
    solution: solution.md
    prerequisites: prerequisites.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
    - ghcr.io/stefanprodan/podinfo:6.15.0
    - mccutchen/go-httpbin:2.25.0
    - quay.io/prometheus-operator/prometheus-config-reloader:v0.94.2
    - quay.io/prometheus/prometheus:v3.15.1
    - registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0
bootstrap:
  init:
  - name: seed
    description: Install the cost plugin and monitoring tools, seed one failing scrape,
      and wait for a fixed report window
    type: file
    source: bootstrap/seed.sh
testing:
  init:
  - name: verify-unfinished-state
    description: Require a ready API and an explicit grader rejection before solving
    type: file
    source: testing/verify-start.sh
    timeout: 10m
  - name: solution
    type: file
    source: solution/apply.sh
validation:
  scripts:
  - name: pricing-model
    description: Check the changed custom pricing ConfigMap
    type: file
    source: validation/validate-pricing-model.sh
  - name: pricing-active
    description: Read the active node and network rates from OpenCost
    type: file
    source: validation/validate-pricing-active.sh
  - name: cost-report
    description: Compare the plugin table with a fresh report for the same closed
      window
    type: file
    source: validation/validate-cost-report.sh
  - name: pod-query
    description: Compare saved pod metrics with Prometheus at the saved evaluation
      time
    type: file
    source: validation/validate-pod-query.sh
  - name: scrape-error
    description: Compare the saved lastError with the live failing target
    type: file
    source: validation/validate-scrape-error.sh
teardown:
  keepCluster: false
