# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Read Cost Allocation With OpenCost (PLAYGROUND).
# OpenCost reads usage from a small Prometheus (plumbing) and prices it with
# its default on-premises price list, because kind has no cloud bill.
apiVersion: astrona.io/v1
metadata:
  name: ats-017-playground-040-01
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    addons:
      metricsServer: true
    preloadImages:
      - curlimages/curl:8.22.0
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0

bootstrap:
  init:
    - name: prepare
      description: Creates the starfleet and outpost workloads, then installs a small Prometheus and OpenCost with Helm
      type: file
      source: bootstrap/prepare.sh

teardown:
  keepCluster: false
