# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Cost Visibility Capstone (ats-017-capstone-040)
# Astrona hands-on lab. kind runtime: a single-node Kubernetes 1.35 cluster.
# A small Prometheus and OpenCost 1.121.3 (default on-premises prices) are
# installed by the bootstrap script. The script takes about 10 minutes,
# because OpenCost needs samples before it returns costs.
apiVersion: astrona.io/v1
metadata:
  name: ats-017-capstone-040
  docs:
    solution: solution.md
    question: question.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    addons:
      metricsServer: true
    preloadImages:
      - curlimages/curl:8.22.0
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0

bootstrap:
  init:
    - name: seed
      description: Creates the starfleet and outpost workloads (three without a team label), installs Prometheus and OpenCost with Helm, and waits until OpenCost returns costs
      type: file
      source: bootstrap/seed.sh

testing:
  init:
    - name: verify-unfinished-state
      description: Require a ready API and an explicit grader rejection before solving
      type: file
      source: testing/verify-start.sh
      timeout: 10m
    - name: solution
      description: Reference solution applied by `astrona test`
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: verify-cost-visibility
      description: Checks the team labels, the ConfigMap cost-report against the stored window and the right-sized workload
      type: file
      source: validation/validate-cost-visibility.sh

teardown:
  keepCluster: false
