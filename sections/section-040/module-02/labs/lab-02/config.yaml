# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Cut Idle Cost By Right-Sizing (ats-017-lab-040-02-02)
# Astrona hands-on lab. kind runtime: a single-node Kubernetes 1.35 cluster.
# A small Prometheus and OpenCost 1.121.3 (default on-premises prices) are
# installed by the bootstrap script. The script takes about 10 minutes,
# because OpenCost needs samples before it returns costs.
apiVersion: astrona.io/v1
metadata:
  name: ats-017-lab-040-02-02
  docs:
    solution: solution.md
    question: question.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    addons:
      metricsServer: true
    preloadImages:
      - curlimages/curl:8.22.0
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0

bootstrap:
  init:
    - name: seed
      description: Creates four Deployments in starfleet (one over-provisioned), installs Prometheus and OpenCost with Helm, and waits until OpenCost returns costs
      type: file
      source: bootstrap/seed.sh

testing:
  init:
    - name: verify-unfinished-state
      description: Require a ready API and an explicit grader rejection before solving
      type: file
      source: testing/verify-start.sh
      timeout: 10m
    - name: solution
      description: Reference solution applied by `astrona test`
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: verify-right-sizing
      description: Checks that the over-provisioned Deployment requests CPU and memory that fit its usage, still runs and still answers, and that no other workload changed
      type: file
      source: validation/validate-right-sizing.sh

teardown:
  keepCluster: false
