# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Bound Tenants With ResourceQuota And LimitRange (PLAYGROUND).
# Two tenant namespaces with no quota and no default resources yet.
apiVersion: astrona.io/v1
metadata:
  name: ats-017-playground-050-01
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - curlimages/curl:8.22.0
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0

bootstrap:
  manifests:
    - name: lab-start
      type: file
      source: manifests/lab-start.yaml
  waitFor:
    - resource: deploy/scout
      namespace: starfleet
    - resource: deploy/scout
      namespace: outpost
    - resource: deploy/probe
      namespace: outpost
    - resource: deploy/shuttle
      namespace: outpost

teardown:
  keepCluster: false
