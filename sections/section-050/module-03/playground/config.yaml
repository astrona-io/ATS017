# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Enforce Tenant Rules With Kyverno (PLAYGROUND).
# One node. Kyverno is installed with Helm. Two tenant namespaces and no
# policies yet.
apiVersion: astrona.io/v1
metadata:
  name: ats-017-playground-050-03
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - curlimages/curl:8.22.0
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0

bootstrap:
  init:
    - name: prepare
      description: Creates the starfleet and outpost workloads, then installs Kyverno with Helm
      type: file
      source: bootstrap/prepare.sh

teardown:
  keepCluster: false
