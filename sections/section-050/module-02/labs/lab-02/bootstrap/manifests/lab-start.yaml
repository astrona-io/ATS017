---
apiVersion: v1
kind: Namespace
metadata:
  name: starfleet
---
apiVersion: v1
kind: Namespace
metadata:
  name: outpost
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: platform-high
value: 100000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: "Platform workloads that may evict tenant batch pods."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beacon
  namespace: outpost
  labels:
    app: beacon
spec:
  replicas: 2
  selector:
    matchLabels:
      app: beacon
  template:
    metadata:
      labels:
        app: beacon
    spec:
      priorityClassName: platform-high
      containers:
        - name: beacon
          image: mccutchen/go-httpbin:2.25.0
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
