# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Make Room With A PriorityClass (ats-017-lab-050-02-01)
# Astrona hands-on lab. kind runtime: a single-node Kubernetes 1.35 cluster.
apiVersion: astrona.io/v1
metadata:
  name: ats-017-lab-050-02-01
  docs:
    solution: solution.md
    question: question.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0

bootstrap:
  init:
    - name: seed
      description: Fills the node with the outpost probe pods and creates a scout-critical Deployment that cannot be scheduled
      type: file
      source: bootstrap/seed.sh

testing:
  init:
    - name: verify-unfinished-state
      description: Require a ready API and an explicit grader rejection before solving
      type: file
      source: testing/verify-start.sh
      timeout: 10m
    - name: solution
      description: Reference solution applied by `astrona test`
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: verify-preemption
      description: Checks scout-critical runs with a tenant PriorityClass, the probe Deployment is unchanged, and the scheduler preempted a probe pod
      type: file
      source: validation/validate-preemption.sh

teardown:
  keepCluster: false
