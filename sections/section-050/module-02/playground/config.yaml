# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Share Capacity With PriorityClasses And Quota Scopes (PLAYGROUND).
# One node. `probe` in `outpost` requests almost all the free CPU, so a new
# pod that requests 300m cannot fit. Only the built-in system PriorityClasses
# exist, and no ResourceQuota.
apiVersion: astrona.io/v1
metadata:
  name: ats-017-playground-050-02
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - curlimages/curl:8.22.0
      - mccutchen/go-httpbin:2.25.0

bootstrap:
  manifests:
    - name: lab-start
      type: file
      source: manifests/lab-start.yaml
  init:
    - name: fill-node
      description: "Create outpost/probe with three replicas sized to use almost all the free CPU of the node"
      type: file
      source: bootstrap/fill-node.sh
  waitFor:
    - resource: deploy/shuttle
      namespace: starfleet

teardown:
  keepCluster: false
