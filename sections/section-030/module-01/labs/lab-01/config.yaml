# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Fix The Unknown HPA Target (ats-017-lab-030-01-01)
# Astrona hands-on lab. kind runtime: a single-node Kubernetes 1.35 cluster
# with metrics-server from the astrona addon.
apiVersion: astrona.io/v1
metadata:
  name: ats-017-lab-030-01-01
  docs:
    solution: solution.md
    question: question.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    addons:
      metricsServer: true
    preloadImages:
      - curlimages/curl:8.22.0
      - ghcr.io/stefanprodan/podinfo:6.15.0

bootstrap:
  init:
    - name: seed-workloads
      description: Creates the starfleet namespace, the scout Deployment without a CPU request, its HPA and the shuttle client
      type: file
      source: bootstrap/seed-workloads.sh

testing:
  init:
    - name: solution
      description: Reference solution applied by `astrona test`
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: verify-hpa-target
      description: Checks scout has a CPU request, the HPA still scales scout on CPU utilisation, the target is resolved, and the HPA adds replicas under load from shuttle
      type: file
      source: validation/validate-hpa-target.sh

teardown:
  keepCluster: false
