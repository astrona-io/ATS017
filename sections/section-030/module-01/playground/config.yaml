# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Scale Workloads With The HorizontalPodAutoscaler (PLAYGROUND).
# metrics-server comes from the astrona addon. No HPA exists yet.
apiVersion: astrona.io/v1
metadata:
  name: ats-017-playground-030-01
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    addons:
      metricsServer: true
    preloadImages:
      - curlimages/curl:8.22.0
      - ghcr.io/stefanprodan/podinfo:6.15.0

bootstrap:
  manifests:
    - name: lab-start
      type: file
      source: manifests/lab-start.yaml
  waitFor:
    - resource: deploy/scout
      namespace: starfleet
    - resource: deploy/scout-norequests
      namespace: starfleet
    - resource: deploy/shuttle
      namespace: starfleet

teardown:
  keepCluster: false
