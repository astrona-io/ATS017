# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Right-Size Workloads From Measured Usage (PLAYGROUND).
# metrics-server comes from the astrona addon; a small Prometheus scrapes the
# kubelet cAdvisor metrics so usage can be queried over time. Both are
# plumbing. No HPA, no VPA.
apiVersion: astrona.io/v1
metadata:
  name: ats-017-playground-030-02
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    addons:
      metricsServer: true
    preloadImages:
      - curlimages/curl:8.22.0
      - ghcr.io/stefanprodan/podinfo:6.15.0

bootstrap:
  init:
    - name: prepare
      description: Creates the starfleet workloads and installs a small Prometheus with Helm
      type: file
      source: bootstrap/prepare.sh

teardown:
  keepCluster: false
