# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
apiVersion: astrona.io/v1
metadata:
  name: ats-017-playground-030-03
  docs:
    guide: docs/overview.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    addons:
      metricsServer: true
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - registry.k8s.io/autoscaling/vpa-admission-controller:1.7.3
      - registry.k8s.io/autoscaling/vpa-recommender:1.7.3
      - registry.k8s.io/autoscaling/vpa-updater:1.7.3
      - registry.k8s.io/ingress-nginx/kube-webhook-certgen:v20231011-8b53cabe0
bootstrap:
  init:
    - name: prepare
      description: Install VPA plumbing and seed the workloads without autoscalers
      type: file
      source: bootstrap/prepare.sh
teardown:
  keepCluster: false
