apiVersion: v1
kind: Namespace
metadata:
  name: starfleet
  labels: {}
---
apiVersion: v1
kind: Namespace
metadata:
  name: outpost
  labels:
    purpose: monitoring
---
apiVersion: v1
kind: Namespace
metadata:
  name: relay
  labels: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shuttle
  namespace: starfleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shuttle
  template:
    metadata:
      labels:
        app: shuttle
    spec:
      containers:
        - name: client
          image: curlimages/curl:8.22.0
          command:
            - sh
            - -c
            - while true; do sleep 30; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
        - name: metrics
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          ports:
            - name: metrics
              containerPort: 9898
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe
  namespace: starfleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: probe
  template:
    metadata:
      labels:
        app: probe
    spec:
      containers:
        - name: client
          image: curlimages/curl:8.22.0
          command:
            - sh
            - -c
            - while true; do sleep 30; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
        - name: metrics
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          ports:
            - name: metrics
              containerPort: 9898
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
        - name: backend
          image: mccutchen/go-httpbin:2.25.0
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /get
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
---
