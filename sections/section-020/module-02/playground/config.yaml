# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Isolate Traffic With NetworkPolicy (PLAYGROUND) — playground environment.
# kind's default CNI (kindnet) enforces NetworkPolicy. No policy exists yet,
# so every request succeeds at the start. No task, no grading.
apiVersion: astrona.io/v1
metadata:
  name: ats-017-playground-020-02
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - curlimages/curl:8.22.0
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:v2.25.0

bootstrap:
  manifests:
    - name: lab-start
      type: file
      source: manifests/lab-start.yaml
  waitFor:
    - resource: deploy/scout
      namespace: starfleet
    - resource: deploy/probe
      namespace: starfleet
    - resource: deploy/shuttle
      namespace: starfleet
    - resource: deploy/probe
      namespace: outpost
    - resource: deploy/shuttle
      namespace: outpost

teardown:
  keepCluster: false
