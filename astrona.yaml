      replicas as utilisation changes, and requests are right-sized from
      measured usage with built-in tools and in-place pod resize. It follows networking and storage because
      autoscaling acts on a complete, reachable workload, and it comes
      before cost because right-sizing is the main lever cost reports
      point at.

