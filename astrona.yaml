  - id: module-050
    title: "Multi-Tenancy Resources"
    description: >
      The reader shares one cluster fairly: each tenant namespace gets a
      quota and default container resources, and priorities decide which
      pods run when the cluster is full. It comes last because it
      combines requests, placement and cost into rules for many teams.

    content:
      - type: reading
        title: Section Overview
        path: sections/section-050/README.md

