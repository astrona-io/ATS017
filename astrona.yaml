# Course manifest for ATS017 - Platform Architecture and Infrastructure
# (Certified Cloud Native Platform Engineer).
#
# One entry per section under `modules:`. Each section lists, in order: its
# README, then for each module the landing page (course.md), its parts
# (course-0N-*.md), and right after the part a lab tests, the lab's
# question.md reading and the `type: lab` entry. The module's wrap-up page
# comes last. The section capstone closes the section. Playgrounds are not
# listed: the landing page's playground marker shows them. solution.md is
# never listed.
#
# Every `path:` is relative to this file.

training:
  id: ATS017
  title: "CNPE: Platform Architecture and Infrastructure"
  description: >
    Training material covering the Certified Cloud Native Platform Engineer
    (CNPE) Platform Architecture and Infrastructure domain: CPU and memory
    requests, limits and QoS classes, pod placement with affinity, taints and
    topology spread, traffic routing with the Gateway API, NetworkPolicy,
    dynamic storage provisioning, horizontal autoscaling and right-sizing
    with in-place pod resize, cost
    allocation with OpenCost, and sharing a cluster between tenants with
    ResourceQuota, LimitRange and PriorityClass. Each module pairs a layered
    reader with an ungraded hands-on playground. Each section closes with an
    integration capstone.
    Built and verified against Kubernetes 1.35.

  certification:
    name: Certified Cloud Native Platform Engineer
    code: CNPE
    provider: CNCF / Linux Foundation
    domain: Platform Architecture and Infrastructure
    weight: 15
    competencies:
      - "Applying Platform Architecture Best Practices for Networking, Storage, and Compute"
      - "Using Cost Management Solutions for Right-Sizing and Scaling"
      - "Optimizing Multi-Tenancy Resource Usage"

modules:

  - id: module-intro
    title: "Introduction"
    description: >
      Start here. What this course trains you to do, how it is laid out, how
      to get your machine ready with the astrona command-line tool, how the
      content is written and checked, who maintains it, and how to report a
      mistake.

    content:
      - type: reading
        title: Introduction
        path: sections/intro/README.md
      - type: reading
        title: "Welcome To The Course"
        path: sections/intro/course-01-welcome.md
      - type: reading
        title: "Get Your Machine Ready"
        path: sections/intro/course-02-get-your-machine-ready.md
      - type: reading
        title: "How This Course Is Made"
        path: sections/intro/course-03-how-this-course-is-made.md

  - id: module-010
