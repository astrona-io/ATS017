    description: >
      The reader gives one workload the CPU and memory it needs and puts
      its pods on the right nodes. Requests and limits come first
      because every later section builds on them: the scheduler places
      by requests, the HPA scales on utilisation of requests, OpenCost
      allocates by requests, and quotas count them.

